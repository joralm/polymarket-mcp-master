[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-mcp"
version = "0.1.0"
description = "Servidor MCP para dados e trading protegido na Polymarket"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.8.0,<2",
    "polymarket-client>=0.20.0,<0.21",
    "eth-account>=0.13.7,<0.14",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "structlog>=24.4.0,<26",
    "uvicorn>=0.34.0,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.27"]

[project.scripts]
polymarket-mcp = "polymarket_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
